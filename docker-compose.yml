services:
  app:
    build:
      context: ./docker/app
    user: "1000:1000"

    depends_on:
      - db
    volumes:
      - ./:/src
      - ./docker/app/php.ini:/usr/local/etc/php/php.ini

  
  node:
    build:
      context: ./docker/node          # 既存の Dockerfile を使うならこのまま
    working_dir: /src/www
    tty: true
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true      # 変更検知の安定化（WSL/共有FS向け）
      - WATCHPACK_POLLING=true
    volumes:
      - ./:/src
      - node_modules:/src/www/node_modules  # ← ここが重要（依存を保持）
    command: >
      sh -lc "(npm ci || npm i) &&
              npm run dev -- --host 0.0.0.0"

  
  db:
    build:
      context: "docker/mysql/"
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - 3306:3306
    environment:
      - MYSQL_DATABASE=database #データベース名
      - MYSQL_HOST=mysql
      - MYSQL_USER=user #ユーザ名
      - MYSQL_PASSWORD=pass #ユーザパスワード
      - MYSQL_ROOT_PASSWORD=root_pass #ルートユーザーのパスワード
      - TZ=Asia/Tokyo
    volumes:
      - "./docker/mysql/storage/:/var/lib/mysql"
      - "./docker/mysql/initdb/:/docker-entrypoint-initdb.d"
  nginx:
    build:
      context: ./docker/nginx
    depends_on:
      - app
    ports:
      - 80:80
    volumes:
      - ./:/src
      - ./docker/nginx/logs:/src/docker/nginx/logs

  redis:
    image: redis:7.2-alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: always

